<!DOCTYPE html>
<html>
<head>
    <title>Test Customer Service</title>
</head>
<body>
    <h1>Customer Service Test</h1>
    <button onclick="testAPI()">Test API Direct</button>
    <button onclick="testProxy()">Test Proxy</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            try {
                const response = await fetch('http://localhost:5000/api/customers?page=1&limit=5');
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }

        async function testProxy() {
            try {
                const response = await fetch('/api/customers?page=1&limit=5');
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
